    </filter>

    <filter id="petalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#4A0009" flood-opacity="0.4" />
    </filter>

    
    <g id="roseFlower">
      
