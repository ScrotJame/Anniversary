      <path d="M -38 -12 C -42 -36, 15 -45, 34 -20 C 46 -2, 32 34, -4 38 C -34 40, -44 12, -32 -14 Z" fill="url(#petalHighlight)" filter="url(#petalShadow)" />
      
      <path d="M -26 -10 C -28 -28, 12 -34, 24 -14 C 32 0, 20 25, -4 26 C -24 27, -30 8, -20 -10 Z" fill="url(#roseBase)" filter="url(#petalShadow)" />
      
      <path d="M -18 -6 C -20 -20, 8 -24, 17 -10 C 23 1, 12 18, -3 17 C -15 16, -18 2, -10 -7 C -3 -14, 10 -8, 8 2 C 7 9, -2 9, -4 3 C -5 -1, 1 -4, 3 -1" fill="none" stroke="#6B000E" stroke-width="3.8" stroke-linecap="round" />
      
      <path d="M -22 -14 C -16 -26, 12 -28, 22 -14" fill="none" stroke="#FF99A4" stroke-width="2" stroke-linecap="round" opacity="0.65" />
      <path d="M -14 -8 C -10 -16, 6 -17, 12 -8" fill="none" stroke="#FF99A4" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
