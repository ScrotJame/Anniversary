<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400">
  <defs>
    
    <radialGradient id="roseBase" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FF5C6C" />
      <stop offset="50%" stop-color="#D40B27" />
      <stop offset="100%" stop-color="#7A0010" />
    </radialGradient>

    <linearGradient id="petalHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7885" />
      <stop offset="60%" stop-color="#DC142F" />
      <stop offset="100%" stop-color="#8A0014" />
    </linearGradient>

    
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CCC65" />
      <stop offset="55%" stop-color="#689F38" />
      <stop offset="100%" stop-color="#33691E" />
    </linearGradient>

    
    <linearGradient id="paperLeft" x1="0%" y1="0%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="100%" stop-color="#EFE0CA" />
    </linearGradient>

    <linearGradient id="paperRight" x1="0%" y1="0%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#DFC4A0" />
      <stop offset="100%" stop-color="#F6E8D4" />
    </linearGradient>

    
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E62565" />
      <stop offset="55%" stop-color="#AD0D43" />
      <stop offset="100%" stop-color="#6E0427" />
    </linearGradient>

    
    <radialGradient id="pearlGrad" cx="35%" cy="30%" r="65%">
