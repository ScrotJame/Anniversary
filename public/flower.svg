  <use href="#roseFlower" transform="translate(166, 66) scale(1.2)" filter="url(#dropShadow)" />
  
  <use href="#roseFlower" transform="translate(82, 108) scale(1.08)" filter="url(#dropShadow)" />
  
  <use href="#roseFlower" transform="translate(248, 118) scale(1.08)" filter="url(#dropShadow)" />
  
  <use href="#roseFlower" transform="translate(116, 168) scale(1.02)" filter="url(#dropShadow)" />
  
  <use href="#roseFlower" transform="translate(202, 174) scale(1.02)" filter="url(#dropShadow)" />

  
  <g filter="url(#dropShadow)">
    <circle cx="226" cy="24" r="8" fill="url(#pearlGrad)" />
    <circle cx="22" cy="146" r="8.5" fill="url(#pearlGrad)" />
    <circle cx="62" cy="164" r="7.5" fill="url(#pearlGrad)" />
    <circle cx="132" cy="112" r="8" fill="url(#pearlGrad)" />
    <circle cx="162" cy="134" r="8" fill="url(#pearlGrad)" />
