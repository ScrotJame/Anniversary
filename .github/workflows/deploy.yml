name: CI / Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Real photos live in the private repo ScrotJame/Anniversary-content.
      # Without the deploy key (e.g. PRs from forks) the site builds with the sample content.
      HAS_CONTENT_KEY: ${{ secrets.CONTENT_DEPLOY_KEY != '' }}
      # Password for the letters (see src/lib/seal.ts). Never commit it; set it under
      # Settings → Secrets and variables → Actions → UNLOCK_PASS.
      UNLOCK_PASS: ${{ secrets.UNLOCK_PASS }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch private photos
        if: env.HAS_CONTENT_KEY == 'true'
        uses: actions/checkout@v7
        with:
          repository: ScrotJame/Anniversary-content
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          path: content-private

      - name: Warn when there is no password
        if: env.HAS_CONTENT_KEY == 'true' && env.UNLOCK_PASS == ''
        run: echo "::warning::Secret UNLOCK_PASS is not set — the letters are only date-locked (unlockAt), no password."

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build # static export to ./out (basePath /Anniversary)

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
